services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DEV_DB: ${MONGODB_DEV_DB:-omniverse_geo_dev}
      MONGODB_TEST_DB: ${MONGODB_TEST_DB:-omniverse_geo_test}
      MONGODB_PROD_DB: ${MONGODB_PROD_DB:-omniverse_geo_prod}
      SPACETRACK_USER: ${SPACETRACK_USER:-}
      SPACETRACK_PASS: ${SPACETRACK_PASS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:19010,http://192.168.1.75:19010,http://100.105.59.33:19010}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    ports:
      - "19011:19011"
    depends_on:
      - mongo
    command: uvicorn main:app --host 0.0.0.0 --port 19011

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://100.105.59.33:19011}
      VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
    ports:
      - "19010:19010"
    depends_on:
      - backend
    command: npm run dev

  mongo:
    image: mongo:7.0.15
    ports:
      - "19012:27017"
    volumes:
      - mongo-data:/data/db

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: test
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_TEST_DB: ${MONGODB_TEST_DB:-omniverse_geo_test}
    depends_on:
      - mongo
    command: pytest
    profiles:
      - test

volumes:
  mongo-data:
