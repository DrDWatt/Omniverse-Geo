version: '3.8'

services:
  # Web application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PORT=8000
    
  # Testing service with explicit dependencies installation
  test:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    command: bash -c "pip install --no-cache-dir httpx pytest-cov requests pytest && pytest -xvs tests/"
